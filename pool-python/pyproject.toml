[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[project]
name = "pool-python"
version = "0.1.0"
description = "A real-time 2D pool/billiards game in Python using pygame-ce."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Pool Python" },
]
keywords = ["pygame-ce", "pygame", "game", "billiards", "pool", "2d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "pygame-ce>=2.5.7,<3",
]

[project.scripts]
pool-python = "pool_python.main:main"

[project.urls]
Homepage = "https://github.com/example/pool-python"
Repository = "https://github.com/example/pool-python"

# PEP 735 — tool-agnostic dev-dependency groups. `uv add --dev <pkg>` writes here.
[dependency-groups]
dev = [
    "ruff>=0.15.20,<0.16",
    "ty>=0.0.55,<0.1",
]

# ---- Ruff: strictest lint + format ------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",   # line-too-long (formatter best-effort)
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "W191",   # tab-indentation
    "D203",   # incorrect-blank-line-before-class
    "D206",   # docstring-tab-indentation
    "D213",   # multi-line-summary-second-line (mutually exclusive with D212)
    "D300",   # triple-single-quotes
    "Q000",   # bad-quotes-inline-string
    "Q001",   # bad-quotes-multiline-string
    "Q002",   # bad-quotes-docstring
    "Q003",   # avoidable-escaped-quote
    "Q004",   # unnecessary-escaped-quote
    "COM812", # missing-trailing-comma
    "COM819", # prohibited-trailing-comma
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

# ---- ty: strictest settings -------------------------------------------------
[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true
output-format = "full"
