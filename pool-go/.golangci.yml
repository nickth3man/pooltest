version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Style / best practices.
    - revive
    - gocritic
    - govet
    - unparam
    - nakedret
    - ineffassign
    - unused
    - staticcheck
    - predeclared
    - unconvert
    - mirror
    - recvcheck
    - iface
    - nestif
    - godot

    # Bug-finders.
    - errorlint
    - bodyclose
    - errcheck
    - nilnil
    - nilerr
    - nilnesserr
    - wastedassign
    - gosec
    - dupl

    # Modern Go idioms.
    - copyloopvar
    - intrange
    - modernize
    - perfsprint

    # Complexity cap — keeps game-loop functions readable.
    - gocyclo

    # Testing hygiene.
    - usetesting

    # Suppression hygiene.
    - nolintlint

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # cosmetic; produces noisy struct-reordering suggestions
      settings:
        shadow:
          strict: true
    gocyclo:
      min-complexity: 25
    nakedret:
      max-func-lines: 0
    revive:
      severity: warning
    perfsprint:
      strconcat: false # allows simple string concatenation without fmt
    nolintlint:
      require-explanation: true
      require-specific: true
    dupl:
      threshold: 150 # game code has structurally similar but distinct per-ball/per-pocket logic
    gosec:
      excludes:
        - G115 # intentional bit-packing in audio synthesis, not attacker-controlled input
        - G404 # math/rand is fine for particle-effect visuals; no crypto/security use

  exclusions:
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: '_test\.go'
        linters: [gocyclo, errcheck, dupl, gosec]
      # Game code legitimately uses os.Exit for unrecoverable startup failure.
      - source: 'os\.Exit'
        linters: [errcheck]
      - source: 'TODO'
        linters: [godot]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/user/pooltest/pool-go
