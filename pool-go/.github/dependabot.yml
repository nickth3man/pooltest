version: 2

updates:
  # Go module dependencies — weekly, grouped so all minor/patch updates
  # arrive as a single PR rather than one PR per dependency.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      go-minor:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # GitHub Actions used in workflows — keep these current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
