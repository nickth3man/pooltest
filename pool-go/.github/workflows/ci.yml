name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint + vet + test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Ebitengine needs GL / X / ALSA dev headers to compile on Linux even
      # for headless tests that never open a window.
      - name: Install Ebitengine native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libasound2-dev

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12
          args: --timeout=5m

      - name: go test (race)
        run: go test -race -count=1 ./...

      - name: go build (native smoke)
        run: go build ./...

      - name: go build (WASM smoke)
        run: GOOS=js GOARCH=wasm go build -o /dev/null .
